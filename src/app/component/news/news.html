<div class="news-wrapper" *ngIf="!loading; else loadingTpl">
  <h1 class="news-title">♟️ Ultime Notizie di Scacchi</h1>

  <div class="news-container">
    <div class="news-card" *ngFor="let n of news">
      <div class="news-image">
        <img [src]="n.imageUrl" alt="Chess Image" />
      </div>
      <div class="news-content">
        <h2>{{ n.title }}</h2>
        <p>{{ n.description }}</p>
        <div class="news-footer">
          <small>{{ n.pubDate | date:'medium' }}</small>
          <a [href]="n.url" target="_blank" class="read-more">Leggi di più →</a>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #loadingTpl>
  <div class="loading-wrapper">
    <p>Caricamento notizie...</p>
  </div>
</ng-template>
