<div class="page-wrapper" [class.shifted]="sidebarOpen">

<!-- Loader -->
<div class="page-loader" *ngIf="isLoading">
  <div class="chess-plane">
    <!-- Piano fittizio -->
    <div class="floor"></div>

    <!-- Pezzi -->
    <img src="https://i.postimg.cc/Z5101SG7/f9957f0e-276e-4469-bcca-8ccdec842bd4.png" alt="Torre" class="piece torre" />
    <img src="https://i.postimg.cc/xjRJqBmN/204ae36f-6251-45f8-8854-9834d68d98a5.png" alt="Pedone" class="piece pedone" />
  </div>
</div>

<div class="app-content" [class.hidden]="isLoading">
  <router-outlet></router-outlet>
</div>

<app-navbar></app-navbar>
<app-navbar2></app-navbar2>
<app-user-card></app-user-card>
<!--<h1>I messaggi</h1>-->
<!--@for (m of messaggiServ.messages; track $index) {-->

<!--})-->
<div class="message-container">
  <h1 class="title">📨 I Messaggi</h1>

  <div class="message-list">
    @for (m of messaggiServ.messages; track $index) {
      <div class="message-card">
        <div class="message-header">
          <h2>{{ m.title }}</h2>
          <span class="timestamp">{{ m.timeStamp?.toLocaleString() }}</span>
        </div>
        <p class="content">{{ m.content }}</p>
        <div class="meta">
          <span><strong>Da:</strong> {{ m.usernameSender || 'Anonimo' }}</span>
          <span><strong>A:</strong> {{ m.usernameReceiver || 'Tutti' }}</span>
          <span><strong>Archiviato:</strong> {{ m.archiviato ? '✅' : '❌' }}</span>
        </div>
      </div>
    }
  </div>
</div>
</div>
